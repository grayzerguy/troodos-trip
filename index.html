<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14201a" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>טיול טרודוס</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 id="trip-name">טוען…</h1>
    <span id="trip-updated" class="muted small"></span>
  </header>

  <div id="banner-offline" class="banner banner-offline" hidden>מצב אופליין – מוצג מידע שמור</div>
  <button id="banner-update" class="banner banner-update" type="button" hidden>יש עדכון, לחץ לרענון</button>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <a href="#today" data-tab="today"><span class="ico" aria-hidden="true">📅</span><span>היום</span></a>
    <a href="#routes" data-tab="routes"><span class="ico" aria-hidden="true">🥾</span><span>מסלולים</span></a>
    <a href="#weather" data-tab="weather"><span class="ico" aria-hidden="true">⛅</span><span>מזג אוויר</span></a>
    <a href="#logistics" data-tab="logistics"><span class="ico" aria-hidden="true">🧳</span><span>לוגיסטיקה</span></a>
    <a href="#emergency" data-tab="emergency" class="tab-emergency"><span class="ico" aria-hidden="true">🚑</span><span>חירום</span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
